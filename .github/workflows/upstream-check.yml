name: Upstream Tag Check

on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  UPSTREAM_REPO: dolphin-emu/dolphin
  FORK_BRANCH: master
  LABEL: upstream-tag

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all tags, filter to Dolphin's YYMM / YYMMa pattern, sort, take latest
          latest=$(gh api "repos/${UPSTREAM_REPO}/tags?per_page=100" \
            --jq '.[].name' \
            | grep -E '^[0-9]{4}[a-z]?$' \
            | sort -r \
            | head -1)

          if [ -z "$latest" ]; then
            echo "No matching upstream tags found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $latest"

      - name: Check if already merged
        if: steps.tag.outputs.found == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Extract upstream base from fork's latest v*-lnk* tag (e.g. v2603a-lnk1 -> 2603a)
          fork_tags=$(gh api "repos/${{ github.repository }}/tags?per_page=100" \
            --jq '.[].name' \
            | grep -E '^v[0-9]{4}[a-z]?-lnk' \
            | sort -r)

          current_base=""
          for ft in $fork_tags; do
            current_base=$(echo "$ft" | sed -E 's/^v([0-9]{4}[a-z]?)-lnk.*/\1/')
            break
          done

          echo "current_base=$current_base"

          if [ "$current_base" == "$TAG" ]; then
            echo "Already merged $TAG (fork tag: $ft). Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Also check for existing open tracking issue
          issues=$(gh issue list --label "$LABEL" --state open --json title,number)
          match=$(echo "$issues" | jq -r --arg tag "$TAG" '.[] | select(.title == "Upstream tag: \($tag)") | .number')

          if [ -n "$match" ]; then
            echo "Issue #$match already tracks $TAG. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "current_base=$current_base" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale issues and PRs
        if: steps.tag.outputs.found == 'true' && steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          stale_issues=$(gh issue list --label "$LABEL" --state open --json number --jq '.[].number')
          for issue in $stale_issues; do
            gh issue close "$issue" --comment "Superseded by newer tag $TAG"
          done

          stale_prs=$(gh pr list --label "$LABEL" --state open --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"')
          while IFS=' ' read -r pr_number branch_name; do
            [ -z "$pr_number" ] && continue
            gh pr close "$pr_number" --comment "Superseded by newer tag $TAG" --delete-branch || true
          done <<< "$stale_prs"

      - name: Checkout fork
        if: steps.tag.outputs.found == 'true' && steps.existing.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Attempt merge
        if: steps.tag.outputs.found == 'true' && steps.existing.outputs.skip == 'false'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          branch="upstream-tag/${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream tag "$TAG" --no-tags

          git checkout -b "$branch"

          if git merge "tags/$TAG" --no-edit -m "Merge upstream tag $TAG"; then
            git push origin "$branch"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.tag.outputs.found == 'true' && steps.existing.outputs.skip == 'false' && steps.merge.outputs.conflict == 'false'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          CURRENT_BASE: ${{ steps.existing.outputs.current_base }}
          MERGE_BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          compare_url="https://github.com/${UPSTREAM_REPO}/compare/${CURRENT_BASE}...${TAG}"

          pr_url=$(gh pr create \
            --base "$FORK_BRANCH" \
            --head "$MERGE_BRANCH" \
            --title "Merge upstream tag ${TAG}" \
            --label "$LABEL" \
            --body "$(cat <<'PREOF'
          Automated merge of upstream tag from ${UPSTREAM_REPO}.

          **Compare:** See tracking issue for details.
          PREOF
          )")

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Create tracking issue
        if: steps.tag.outputs.found == 'true' && steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          CURRENT_BASE: ${{ steps.existing.outputs.current_base }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          compare_url="https://github.com/${UPSTREAM_REPO}/compare/${CURRENT_BASE}...${TAG}"

          if [ "$CONFLICT" == "true" ]; then
            status="**Merge conflicts detected** — manual merge required."
          else
            status="Auto-merge PR: $PR_URL"
          fi

          gh issue create \
            --title "Upstream tag: ${TAG}" \
            --label "$LABEL" \
            --body "## Upstream Tag: ${TAG}

          **Repo:** \`${UPSTREAM_REPO}\`
          **Compare:** [${CURRENT_BASE}...${TAG}](${compare_url})

          ### Status
          ${status}"
